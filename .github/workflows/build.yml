name: Build APK and prerelease
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Python reference
        run: |
          python -m pip install Pillow==12.1.1
          python roundtrip_test.py
          python depth_probe_test.py
      - name: Test codec, transfer protocol and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug assembleRelease
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: ignore
      - name: Sign release APK
        if: github.event_name != 'pull_request'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0
      - name: Collect signed APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          FILE=$(find app/build/outputs/apk/release -maxdepth 1 -name '*-signed.apk' -print -quit)
          test -n "$FILE"
          mkdir -p release-files
          NAME="Boltt-Studio-Prerelease-${GITHUB_SHA:0:12}-Universal.apk"
          cp "$FILE" "release-files/$NAME"
          (cd release-files && sha256sum "$NAME" > "$NAME.sha256")
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: signed-apk
          path: release-files/*
          if-no-files-found: error
  prerelease:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prerelease-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: signed-apk
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Boltt Studio preview ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Native clock editor: linked/independent size and movement, width/height/spacing, and manual clock-alpha brush.
            Photo depth is NOT established: test occlusion through minute changes and screen sleep/wake.
            See docs/CLOCK_EDITING.md and docs/DEPTH_TEST.md. New glyph sizes/four-table masks need device testing.
            No AI subject segmentation or frozen-clock fallback is included.
            CI checks codec/protocol logic; it does not establish physical watch compatibility or safe recovery.
            Preserved HTML/Python prototypes and protocol notes remain in the repository.
          files: release-files/*
  prune-prereleases:
    needs: prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prerelease-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const all = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            const releases = all.filter(r => r.prerelease && !r.draft)
              .sort((a,b) => Date.parse(b.published_at) - Date.parse(a.published_at) || b.id-a.id);
            for (const candidate of releases.slice(5)) {
              const {data: release} = await github.rest.repos.getRelease({...repo, release_id: candidate.id});
              if (!release.prerelease || release.draft) continue;
              await github.rest.repos.deleteRelease({...repo, release_id: release.id});
              if (/^prerelease-[0-9a-f]{40}$/.test(release.tag_name)) {
                try { await github.rest.git.deleteRef({...repo, ref: `tags/${release.tag_name}`}); }
                catch (error) { if (error.status !== 404 && error.status !== 422) throw error; }
              }
            }
